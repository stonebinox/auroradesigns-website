<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0A0A0B;
      font-family: 'JetBrains Mono', monospace;
      padding: 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #3DD6A0;
    }

    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 68px;
      line-height: 1.1;
      color: #EDEDEF;
      letter-spacing: -0.02em;
      max-width: 900px;
      margin-top: 40px;
    }

    .rule {
      width: 80px;
      height: 3px;
      background: #3DD6A0;
      margin-top: 48px;
    }

    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: 16px;
      color: #8A8F98;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div>
    <p class="eyebrow">Aurora Designs</p>
    <h1 class="headline">Forward-deployed engineers for AI-native systems.</h1>
    <div class="rule"></div>
  </div>
  <p class="footer">auroradesignshq.com</p>
</body>
</html>
